name: Build release

on:
  push:
    tags:
      - 'v\d+.\d+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release
    timeout-minutes: 20
    continue-on-error: false

    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [
          { os: 'ubuntu-latest',  uberjar: true  },
          { os: 'ubuntu-latest',  uberjar: false },
          { os: 'windows-latest', uberjar: false },
          { os: 'macos-15-intel', uberjar: false },
          { os: 'macos-latest',   uberjar: false }
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21.0.7'
          cache: gradle
          cache-dependency-path: gradle/wrapper/gradle-wrapper.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        run: ./gradlew clean release --no-daemon --stacktrace
        env:
          UBERJAR_BUILD: ${{ matrix.variant.uberjar }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: murglar-${{ matrix.variant.uberjar && 'uberjar' || format('{0}-{1}', runner.os, runner.arch) }}
          path: build/artifacts/

  release:
    name: Create GitHub release
    needs: build
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"

          if [ -z "$previous_tag" ]; then
            echo "## Changes" > release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:'- %s (%h)' "$current_tag" >> release-notes.md
          else
            echo "## Changes since $previous_tag" > release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:'- %s (%h)' "$previous_tag..$current_tag" >> release-notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AniMurglar ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-artifacts/**
